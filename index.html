<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Supplier Code of Conduct - Awareness Session</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf1f8;font-family:Arial,Helvetica,sans-serif;color:#1b2a3a;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#fff;width:100%;max-width:480px;margin:16px;padding:32px;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.15);text-align:center}
h1{color:#1f4e79;font-size:22px;margin:0 0 12px}
p{line-height:1.5;margin:0 0 18px}
input{width:100%;padding:12px;font-size:16px;border:1px solid #b9c7d6;border-radius:8px;margin-bottom:16px}
button{background:#2a5a8c;color:#fff;border:0;border-radius:8px;padding:14px 36px;font-size:16px;cursor:pointer}
.note{font-size:12px;color:#5b6b7b;margin:18px 0 0;line-height:1.45}
.note a{color:#2a5a8c}
</style>
</head>
<body>
<div class="card">
  <h1>Supplier Code of Conduct</h1>
  <p>Wilhelmsen Port Services awareness session. Please enter your email address, then press the button to begin.</p>

  <!-- >>> EDIT THIS ONE LINE: put your worker address before /start (no space, no slash at the end of the address) <<< -->
  <form method="POST" action="https://REPLACE-WITH-YOUR-WORKER-ADDRESS/start">
    <input type="email" name="email" placeholder="you@company.com" required autocomplete="email">
    <button type="submit">Start the Awareness Session</button>
  </form>

  <p class="note">Your email address is recorded only to confirm that you have taken this training. See our
    <a href="https://www.wilhelmsen.com/disclaimer/">Privacy Statement</a>. Questions: wps.supplier.Governance@wilhelmsen.com</p>
</div>
</body>
</html>
